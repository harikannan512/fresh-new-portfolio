baseURL: "/"
theme: "terminalcv"
title: "Hari Prasad Kannan - Portfolio"

params:
  version: "v26.05.05"
  description: "Hari Prasad Kannan's Terminal CV"
  blog: 
    enabled: false
    lsClassic: true
  
  prompt:
    core:
      text: "hari@portfolio"
      color: "cyan"
      before: "["
      beforeColor: "green"
      after: ']'
      afterColor: "green"
    separator:
      text: "-"
      color: "white"
    path:
      before: "["
      beforeColor: "green"
      text: "~/cv"
      color: "blue"
      after: ']'
      afterColor: "green"
    extra:
      text: "$ "
      color: "white"

  exitMessage: "[Session completed, the browser window can be safely closed]"
  source: true
  cvPdfLocation: "/career/cv-en.pdf"
  
  bootsequence: |
    Initializing terminal...
    Loading portfolio data...
    Ready.
  
